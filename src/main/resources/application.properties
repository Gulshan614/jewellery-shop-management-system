spring.application.name=jewellery-shop
server.port=8080

# MySQL (override with environment variables if needed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jewellery_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka (used from Step 5; broker is not required to start the app)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
